{% extends "base.html" %}
{% block content %}
<div class="landing-page">
    <div class="landing-page-content">
        <h1>Fiona's Music Database</h1><br><br>
        <h3>Latest Additions</h3><br>
        <table class="latest-additions">
            {% for album in albums %}
            <tr>
                <td><b>{{ album.artist.name }}</b></td>
                <td>{{ album.title }}</td>
                <td><button type="button"><a
                            href="{{ url_for('main.album_details', album_id=album.id) }}">Details</a></button></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

{% endblock %}
