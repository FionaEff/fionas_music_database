{% extends "base.html" %}
{% block content %}

<div class="artists-list">
    <table class="artists-list-table">
        {% for artist in artists %}
        <tr>
            <td>{{ artist.name }}</td>
            <td>
                <button type="button"><a href="{{ url_for('main.artist_details', artist_id=artist.id) }}">Details</a></button>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
