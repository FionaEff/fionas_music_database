{% extends "base.html" %}
{% block content %}

<div class="albums-list">
    <table class="albums-list-table">
        {% for album in albums %}
        <tr>
            <td>{{ album.artist.name }}</td>
            <td>{{ album.year }}</td>
            <td>{{ album.title }}</td>
            <td>
                <button type="button"><a href="{{ url_for('main.album_details', album_id=album.id) }}">Details</a></button>
            </td>
            <td>
                <button type="button"><a href="{{ url_for('main.delete_album', album_id=album.id) }}">Delete Album</a></button>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
